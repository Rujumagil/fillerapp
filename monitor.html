<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006241">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/filler-icon-192.png">
  <link rel="apple-touch-icon" href="assets/filler-icon-192.png">
  <title>Filler Monitor</title>
  <style>
    body{margin:0;background:#073c2c;color:white;font-family:system-ui}main{padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:18px}.card.late-card{background:#b64235;border-color:#ffb7ad}.card.ready-card{background:#dff4e8;color:#063b2c}.card.prep-card{background:#e9f2ff;color:#123c6b}.card.new-card{background:#fff4d8;color:#5d3c00}.badge{display:inline-block;border-radius:999px;padding:7px 11px;font-weight:900;margin-bottom:10px;background:rgba(255,255,255,.22)}.time{font-size:18px;font-weight:900}.detail{opacity:.85}@media(max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main><div class="top"><h1>Pedidos Filler</h1><div id="clock"></div></div><div class="grid" id="orders"></div></main>
  <script src="pwa.js"></script>
  <script>
    const escapeHTML=v=>String(v??"").replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[c]));
    const min=ms=>Math.floor(ms/60000);
    function stateInfo(o){const now=Date.now();const created=o.createdTs||now;const updated=o.statusUpdatedAt||created;if((o.status==="Nuevo"||o.status==="Preparando")&&now-created>10*60000)return{card:"late-card",label:"Fuera de tiempo",detail:`${min(now-created)} min en preparacion`};if(o.status==="Listo"&&now-updated>10*60000)return{card:"late-card",label:"Fuera de tiempo",detail:`${min(now-updated)} min sin recoger`};if(o.status==="Listo")return{card:"ready-card",label:"Listo",detail:`${min(now-updated)} min listo`};if(o.status==="Preparando")return{card:"prep-card",label:"Preparando",detail:`${min(now-created)} min`};return{card:"new-card",label:"Nuevo",detail:`${min(now-created)} min`}}
    function render(){const orders=JSON.parse(localStorage.getItem("fillerOrders")||"[]").filter(o=>o.status!=="Entregado");document.getElementById("clock").textContent=new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});document.getElementById("orders").innerHTML=orders.length?orders.map(o=>{const s=stateInfo(o);return `<article class="card ${s.card}"><span class="badge">${s.label}</span><h2>${escapeHTML(o.id)}</h2><h3>${escapeHTML(o.customer)}</h3><p class="time">${s.detail}</p><p>Recoge: ${escapeHTML(o.pickup)}</p><p>${o.items.map(i=>`${i.qty} x ${escapeHTML(i.name)}${i.extras?.length?`<br><small style="color:inherit;opacity:.92"><b>Extras:</b> ${i.extras.map(x=>escapeHTML(x.name)).join(", ")}</small>`:""}`).join("<br>")}</p></article>`}).join(""):"<h2>Sin pedidos activos</h2>"}render();setInterval(render,3000)
  </script>
</body>
</html>
