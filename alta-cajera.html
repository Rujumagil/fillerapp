<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fiiller | Alta Cajera 1</title>
<style>body{font:16px system-ui;background:#f7f1e7;color:#17382a;margin:0}main{max-width:540px;margin:40px auto;padding:22px;background:white;border-radius:20px}h1{color:#006241}label{display:block;margin:18px 0;font-weight:650}input{display:block;width:100%;padding:12px;margin-top:8px;box-sizing:border-box;border:1px solid #abbfb0;border-radius:9px}button{background:#006241;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}button:disabled{opacity:.5}#status{margin:15px 0;white-space:pre-wrap}a{color:#006241}</style></head>
<body><main><h1>Fiiller Café · Alta de Cajera 1</h1><p>Solo un administrador de Fiiller puede crear este acceso.</p>
<section id="access"><form id="admin-form"><label>Contraseña de administrador<input id="admin-password" type="password" autocomplete="current-password" required></label><button>Validar administrador</button></form></section>
<section id="registration" hidden><form id="register-form"><label>Correo de Lupita<input id="cashier-email" type="email" value="paolitaveloz24@gmail.com" readonly></label><label>Contraseña inicial para Lupita<input id="cashier-password" type="text" minlength="12" required autocomplete="off"></label><button type="button" id="generate">Generar contraseña</button> <button id="create">Crear acceso</button></form><p>Entrega la contraseña a Lupita por un canal privado.</p></section>
<p id="status" role="status"></p><section id="success" hidden><p><strong>Acceso creado en Supabase.</strong></p><p>Correo: paolitaveloz24@gmail.com</p><p id="credential"></p><p><a href="caja.html">Ir a Caja 1</a></p></section></main>
<script src="filler-cloud.js?v=54"></script><script>
(()=>{const $=id=>document.getElementById(id);
async function show(){const role=await FillerCloud.staffRole();$("access").hidden=role==="admin";$("registration").hidden=role!=="admin";}
$("admin-form").onsubmit=async e=>{e.preventDefault();try{const r=await FillerCloud.login("admin",$("admin-password").value);if(r.role!=="admin")throw Error("Acceso denegado");$("admin-password").value="";await show();$("status").textContent="Administrador autorizado.";}catch(err){$("status").textContent=err.message}};
$("generate").onclick=()=>{const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";const bytes=crypto.getRandomValues(new Uint8Array(24));$("cashier-password").value=Array.from(bytes,b=>chars[b%chars.length]).join("")};
$("register-form").onsubmit=async e=>{e.preventDefault();$("create").disabled=true;try{if(await FillerCloud.staffRole()!=="admin")throw Error("No autorizado");const password=$("cashier-password").value;const token=await FillerCloud.accessToken();const r=await fetch("https://qwxydjotwhniahaovrff.supabase.co/functions/v1/fiiller-create-cajera1",{method:"POST",headers:{"Authorization":"Bearer "+token,"apikey":"sb_publishable_17NekbDHp_ssL_Pf-CnqPg_v0acxqn3","Content-Type":"application/json"},body:JSON.stringify({email:$("cashier-email").value,password})});const d=await r.json();if(!r.ok)throw Error(d.error||"Error de registro");$("registration").hidden=true;$("success").hidden=false;$("credential").textContent="Contraseña inicial: "+password;$("cashier-password").value="";$("status").textContent="Alta completada. Guarda y comparte las credenciales de forma privada.";}catch(err){$("status").textContent=err.message}finally{$("create").disabled=false}};
show().catch(err=>$("status").textContent=err.message);
})();
</script></body></html>
