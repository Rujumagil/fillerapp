<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filler Pedidos</title>
  <style>
    :root{--green:#006241;--mint:#e8f2ed;--cream:#f7f1e7;--ink:#1e2f29;--muted:#69766f;--line:#e4ded4;--shadow:0 12px 28px rgba(51,36,18,.1)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f1e7;color:var(--ink)}main{max-width:980px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}h1{margin:0}.muted{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}button{border:0;border-radius:999px;background:var(--green);color:white;padding:10px 13px;font-weight:850;cursor:pointer}.line{border-top:1px solid #eee;padding:14px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}.empty{border:1px dashed #cfc8bd;border-radius:16px;padding:18px;text-align:center;color:var(--muted)}.top-links a{color:var(--green);font-weight:850;text-decoration:none;margin-left:10px}@media(max-width:720px){header{display:block}.top-links{margin-top:10px}.top-links a{margin:0 10px 0 0}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>Pedidos</h1><p class="muted">Control para cocina y entrega.</p></div><nav class="top-links"><a href="admin.html">Control</a><a href="monitor.html">Monitor</a></nav></header>
    <section class="card"><div id="orders"></div></section>
  </main>
  <script>
    let orders=JSON.parse(localStorage.getItem("fillerOrders")||"[]");
    const money=v=>"$"+Number(v||0).toLocaleString("es-MX");
    const save=()=>localStorage.setItem("fillerOrders",JSON.stringify(orders));
    function render(){document.getElementById("orders").innerHTML=orders.length?orders.map(o=>`<div class="line"><b>${o.id} - ${o.customer}</b><br>${o.phone} | Recoge ${o.pickup}<br>${o.items.map(i=>`${i.qty} x ${i.name}`).join("<br>")}<br><b>${money(o.total)}</b><div class="actions"><button onclick="status('${o.id}','Preparando')">Preparando</button><button onclick="status('${o.id}','Listo')">Listo</button><button onclick="status('${o.id}','Entregado')">Entregado</button><span class="muted">${o.status}</span></div></div>`).join(""):`<div class="empty">Sin pedidos.</div>`}
    function status(id,s){const order=orders.find(o=>o.id===id);if(order)order.status=s;save();render()}
    render();setInterval(()=>{orders=JSON.parse(localStorage.getItem("fillerOrders")||"[]");render()},3000);
  </script>
</body>
</html>
