<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006241">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/filler-icon-192.png">
  <link rel="apple-touch-icon" href="assets/filler-icon-192.png">
  <title>Filler Pedidos</title>
  <style>
    :root{--green:#006241;--mint:#e8f2ed;--cream:#f7f1e7;--ink:#1e2f29;--muted:#69766f;--line:#e4ded4;--danger:#b64235;--yellow:#fff4d8;--blue:#e9f2ff;--shadow:0 12px 28px rgba(51,36,18,.1)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f1e7;color:var(--ink)}main{max-width:1060px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}h1{margin:0}.muted{color:var(--muted)}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.dot{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.new{background:var(--yellow);color:#5d3c00}.prep{background:var(--blue);color:#123c6b}.ready{background:var(--mint);color:#063b2c}.done{background:#eee;color:#555}.late{background:var(--danger);color:white}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}button{border:0;border-radius:999px;background:var(--green);color:white;padding:10px 13px;font-weight:850;cursor:pointer}.line{border-top:1px solid #eee;padding:14px;border-radius:16px}.line.alert{background:#fff1ef;border:2px solid var(--danger)}.line.ok{background:#f8fffb;border:1px solid #cfe8d8}.line.wait{background:#fffaf0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}.empty{border:1px dashed #cfc8bd;border-radius:16px;padding:18px;text-align:center;color:var(--muted)}.top-links a{color:var(--green);font-weight:850;text-decoration:none;margin-left:10px}.progress{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.timer{font-weight:900}.note{font-size:13px;color:var(--muted)}@media(max-width:720px){header{display:block}.top-links{margin-top:10px}.top-links a{margin:0 10px 0 0}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>Pedidos</h1><p class="muted">Control para cocina y entrega con tiempos reales.</p><div class="legend"><span class="dot new">Nuevo</span><span class="dot prep">Preparando</span><span class="dot ready">Listo</span><span class="dot late">Fuera de tiempo</span></div></div><nav class="top-links"><a href="admin.html">Control</a><a href="monitor.html">Monitor</a></nav></header>
    <section class="card"><div id="orders"></div></section>
  </main>
  <script src="pwa.js"></script>
  <script>
    let orders=JSON.parse(localStorage.getItem("fillerOrders")||"[]");
    const escapeHTML=v=>String(v??"").replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[c]));
    const money=v=>"$"+Number(v||0).toLocaleString("es-MX");
    const min=ms=>Math.floor(ms/60000);
    const save=()=>localStorage.setItem("fillerOrders",JSON.stringify(orders));
    function baseTime(o){return o.createdTs||Date.now()}
    function stateInfo(o){const now=Date.now();const created=baseTime(o);const updated=o.statusUpdatedAt||created;if((o.status==="Nuevo"||o.status==="Preparando")&&now-created>10*60000)return{cls:"late",line:"alert",label:"Fuera de tiempo",detail:`${min(now-created)} min desde que entro. Meta: 10 min preparacion.`};if(o.status==="Listo"&&now-updated>10*60000)return{cls:"late",line:"alert",label:"Fuera de tiempo",detail:`${min(now-updated)} min esperando recoleccion. Meta: 10 min.`};if(o.status==="Listo")return{cls:"ready",line:"ok",label:"Listo",detail:`Listo desde hace ${min(now-updated)} min.`};if(o.status==="Preparando")return{cls:"prep",line:"wait",label:"Preparando",detail:`${min(now-created)} min de preparacion.`};if(o.status==="Entregado")return{cls:"done",line:"ok",label:"Entregado",detail:"Pedido cerrado."};return{cls:"new",line:"wait",label:"Nuevo",detail:`${min(now-created)} min desde que entro.`}}
    function render(){document.getElementById("orders").innerHTML=orders.length?orders.map(o=>{const s=stateInfo(o);return `<div class="line ${s.line}"><div class="progress"><span class="dot ${s.cls}">${s.label}</span><span class="timer">${s.detail}</span></div><b>${escapeHTML(o.id)} - ${escapeHTML(o.customer)}</b><br>${escapeHTML(o.phone)} | Recoge ${escapeHTML(o.pickup)}<br>${o.items.map(i=>`${i.qty} x ${escapeHTML(i.name)}${i.extras?.length?`<div class="note"><b>Extras:</b> ${i.extras.map(x=>escapeHTML(x.name)).join(", ")}</div>`:""}`).join("<br>")}<br><b>${money(o.total)}</b>${o.notes?`<div class="note">Notas: ${escapeHTML(o.notes)}</div>`:""}<div class="actions"><button onclick="status('${o.id}','Preparando')">Preparando</button><button onclick="status('${o.id}','Listo')">Listo</button><button onclick="status('${o.id}','Entregado')">Entregado</button></div></div>`}).join(""):`<div class="empty">Sin pedidos.</div>`}
    function status(id,s){const order=orders.find(o=>o.id===id);if(order){order.status=s;order.statusUpdatedAt=Date.now();if(!order.createdTs)order.createdTs=order.statusUpdatedAt}save();render()}
    render();setInterval(()=>{orders=JSON.parse(localStorage.getItem("fillerOrders")||"[]");render()},3000);
  </script>
</body>
</html>
