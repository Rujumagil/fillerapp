<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006241"><title>Centro de mensajes | Fiiller Café</title>
<style>body{font-family:system-ui,Arial;background:#fbf7ef;color:#173b2b;margin:0}main{max-width:960px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}a{color:#006241;font-weight:700}.card{background:white;border:1px solid #dfebdf;border-radius:18px;padding:19px;margin:15px 0;box-shadow:0 8px 24px #103e2210}button{background:#006241;color:white;border:0;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input,textarea,select{font:inherit;border:1px solid #adc9b8;border-radius:10px;padding:12px;box-sizing:border-box;width:100%}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:16px}.thread{display:block;width:100%;text-align:left;background:#f1f8f2;color:#153d28;margin:7px 0}.thread.active{background:#006241;color:white}.bubble{padding:12px;border-radius:13px;margin:8px 0;max-width:88%;background:#eef3eb;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{background:#d6efe0;margin-left:auto}.muted{font-size:13px;color:#617365}.feed{min-height:210px;max-height:55vh;overflow:auto}#feedback{color:#a53527;font-weight:600;min-height:24px}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}</style></head>
<body><main><header><div><h1>☕ Mensajes Fiiller</h1><p class="muted">Pregunta por productos, existencias o tu pedido.</p></div><a id="back" href="./mi-filler.html">Volver a Fiiller</a></header>
<p id="feedback" role="status" aria-live="polite"></p>
<section class="card" id="new-thread"><h2>Iniciar consulta</h2><p class="muted">Puedes escribirnos aunque todavía no hayas realizado un pedido. Requiere iniciar sesión.</p><label>Asunto<input id="subject" maxlength="120" placeholder="¿Tienen disponible...?" value="Consulta de productos"></label><p><button id="open-thread">Abrir conversación</button></p></section>
<div class="grid"><section class="card"><h2>Conversaciones</h2><div id="threads">Cargando…</div></section><section class="card"><h2 id="thread-title">Selecciona una conversación</h2><div id="messages" class="feed" role="log" aria-live="polite"></div><form id="send-form"><label for="message">Tu mensaje</label><textarea id="message" maxlength="1000" placeholder="Escribe aquí…" required></textarea><p><button id="send" disabled>Enviar mensaje</button></p></form></section></div></main>
<script src="./filler-cloud.js?v=50"></script><script src="./fiiller-customer-session.js?v=1"></script>
<script>
(async()=>{
const API="https://qwxydjotwhniahaovrff.supabase.co/rest/v1/", KEY="sb_publishable_17NekbDHp_ssL_Pf-CnqPg_v0acxqn3";
const $=id=>document.getElementById(id), staff=new URLSearchParams(location.search).has("personal");
$("back").href=staff?"./admin.html":"./mi-filler.html";
$("new-thread").hidden=staff;
let myId=null, current=null, threads=[];
function feedback(t){$("feedback").textContent=t||""}
async function auth(){if(staff){const role=await FillerCloud.staffRole();if(!role)throw Error("Accede primero con tu cuenta de personal en el panel de control.");const jwt=await FillerCloud.accessToken();const data=JSON.parse(atob(jwt.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));myId=data.sub;return jwt}
const session=await FiillerCustomerSession.getSession();if(!session?.access_token||!session.user?.id)throw Error("Inicia sesión en Mi Fiiller para abrir tu centro de mensajes.");
const response=await fetch("https://qwxydjotwhniahaovrff.supabase.co/auth/v1/user",{headers:{apikey:KEY,Authorization:"Bearer "+session.access_token},cache:"no-store"});
if(!response.ok)throw Error("Tu sesión ha vencido. Ingresa nuevamente a Mi Fiiller.");
const verified=await response.json();if(verified.id!==session.user.id)throw Error("Tu cuenta no coincide con la sesión actual.");myId=verified.id;return session.access_token;}
async function request(path,options={}){const jwt=await auth(),response=await fetch(API+path,{...options,headers:{apikey:KEY,Authorization:"Bearer "+jwt,...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})},cache:"no-store"});const t=await response.text();let data;try{data=JSON.parse(t)}catch{data=t}if(!response.ok)throw Error(data.message||"Error de conexión ("+response.status+")");return data}
function elem(tag,text,cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node}
async function load(){threads=await request("filler_support_threads?select=id,subject,created_at,customer_user_id,order_id&order=created_at.desc&limit=100");$("threads").replaceChildren();if(!threads.length)$("threads").append(elem("p","No hay conversaciones todavía.","muted"));for(const t of threads){const b=elem("button",t.subject,"thread"+(current===t.id?" active":""));b.type="button";b.onclick=()=>select(t.id);$("threads").append(b)}if(current&&!threads.some(t=>t.id===current)){current=null;$("send").disabled=true}}
async function select(id){current=id;const thread=threads.find(t=>t.id===id);$("thread-title").textContent=thread?.subject||"Conversación";$("send").disabled=false;await load();const records=await request("filler_support_messages?select=id,body,sender_id,created_at&thread_id=eq."+encodeURIComponent(id)+"&order=created_at.asc&limit=150");$("messages").replaceChildren();for(const m of records){const block=elem("div",m.body,"bubble"+(m.sender_id===myId?" mine":""));block.append(elem("div",new Date(m.created_at).toLocaleString("es-MX"),"muted"));$("messages").append(block)}$("messages").scrollTop=$("messages").scrollHeight}
$("open-thread").onclick=async()=>{try{$("open-thread").disabled=true;const subject=$("subject").value.trim();if(!subject)return;const rows=await request("filler_support_threads?select=id",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify([{subject,customer_user_id:myId}])});await load();await select(rows[0].id);feedback("")}catch(e){feedback(e.message)}finally{$("open-thread").disabled=false}};
$("send-form").onsubmit=async e=>{e.preventDefault();if(!current)return;const body=$("message").value.trim();if(!body)return;try{$("send").disabled=true;await request("filler_support_messages",{method:"POST",body:JSON.stringify([{thread_id:current,sender_id:myId,body}])});$("message").value="";await select(current);feedback("")}catch(err){feedback(err.message)}finally{$("send").disabled=false}};
try{await load();const order=new URLSearchParams(location.search).get("pedido");if(order&&!staff){const existing=threads.find(t=>t.order_id===order);if(existing)await select(existing.id);else{const rows=await request("filler_support_threads?select=id",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify([{customer_user_id:myId,order_id:order,subject:"Consulta sobre mi pedido"}])});await load();await select(rows[0].id)}}}catch(e){feedback(e.message);$("threads").textContent="Inicia sesión para consultar tus mensajes."}
setInterval(async()=>{if(current&&document.visibilityState==="visible")try{await select(current)}catch{}},15000);
})();
</script></body></html>
