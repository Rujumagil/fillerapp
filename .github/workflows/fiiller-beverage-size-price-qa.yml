name: Fiiller beverage size price QA
on:
  push:
    branches: [fix/fiiller-hide-duplicate-beverage-price-20261030]
  pull_request:
    paths: ['extras-storefront.js','tests/fiiller-beverage-size-price.cjs']
jobs:
  price-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          node --check extras-storefront.js
          node tests/fiiller-beverage-size-price.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiiller-beverage-price-screenshots
          path: artifacts/beverage-size-only-*.png
          if-no-files-found: ignore
