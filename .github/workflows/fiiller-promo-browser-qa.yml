name: Fiiller browser checkout visual QA
on:
  push:
    branches: [feature/promo-product-links-20261029]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile mock checkout
        run: node tests/promo-browser.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiiller-browser-qa
          path: artifacts/
          if-no-files-found: ignore
