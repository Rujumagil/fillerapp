name: Fiiller marketing admin browser QA
on:
  push:
    branches: [qa/fiiller-admin-marketing-20261029]
  pull_request:
    paths: ['tests/marketing-admin-browser.cjs', 'storefront-features-admin.js', 'promociones-admin.html']
jobs:
  marketing-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run admin editor QA
        run: node tests/marketing-admin-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiiller-marketing-admin-screens
          path: artifacts/marketing-admin-*.png
          if-no-files-found: ignore
