name: Fiiller chilaquiles guided order QA
on:
  push:
    branches: [feature/fiiller-chilaquiles-wizard-20261030]
  pull_request:
    paths: ['extras-storefront.js', 'tests/chilaquiles-browser.cjs']
jobs:
  chilaquiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node --check extras-storefront.js
      - run: node tests/chilaquiles-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiiller-chilaquiles-qa
          path: artifacts/chilaquiles-*.png
          if-no-files-found: ignore
