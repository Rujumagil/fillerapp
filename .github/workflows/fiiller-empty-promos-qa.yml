name: Fiiller empty promotions QA
on:
  push:
    branches: [feature/fiiller-promos-empty-state-admin-20261030]
  pull_request:
    paths: ['storefront-features.js','promociones-admin.html','fiiller-premium.css','tests/fiiller-empty-promos.cjs']
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          node --check storefront-features.js
          node --check storefront-features-admin.js
          node tests/fiiller-empty-promos.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiiller-empty-promos-screenshots
          path: artifacts/fiiller-empty-promos-*.png
          if-no-files-found: ignore
