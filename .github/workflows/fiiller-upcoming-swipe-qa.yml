name: Fiiller upcoming mobile swipe QA
on:
  push:
    branches: [feature/fiiller-mobile-upcoming-swipe-20261030]
  pull_request:
    paths: ['fiiller-premium.css','index.html','tests/upcoming-swipe-browser.cjs']
jobs:
  swipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/upcoming-swipe-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upcoming-swipe-screenshots
          path: artifacts/upcoming-swipe-*.png
          if-no-files-found: ignore
