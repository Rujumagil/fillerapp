name: Fiiller tortas sandwiches QA
on:
  push:
    branches: [feature/fiiller-tortas-sandwiches-picker-20261030]
  pull_request:
    paths: ['extras-storefront.js', 'tests/tortas-sandwiches-browser.cjs']
jobs:
  checkout-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node --check extras-storefront.js
      - run: node tests/tortas-sandwiches-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tortas-sandwiches-screens
          path: artifacts/tortas-sandwiches-*.png
          if-no-files-found: ignore
